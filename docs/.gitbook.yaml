  functionality/payment-providers: guides/providers.md
  functionality/shipping-providers: guides/shipping.md
  functionality/discounts: guides/discounts.md

  how-to/add-to-cart: examples/storefront.md
  how-to/remove-update-orderline: examples/storefront.md
  how-to/query-filter-and-render-products: examples/storefront.md
  how-to/query-and-render-categories: examples/storefront.md
  how-to/render-and-update-payment-provider: examples/storefront.md
  how-to/render-and-update-shipping-provider: examples/storefront.md
  how-to/render-prices-and-discounts: examples/storefront.md
  how-to/managing-inventory: guides/stock.md

  extend/extend-product-category: examples/custom-models.md
  events/events: examples/events.md
  helpers/coming-soon: README.md

  payments/ekom-payments-checkout: guides/payments.md
