name: publish-ekom

on:
  push:
    tags:
      - "Ekom-v*"
  workflow_dispatch:
    inputs:
      unlist_unwanted_1_0_0:
        description: "Unlist only the nine unintended Ekom 1.0.0 packages after both corrected releases are available"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-ekom:
    if: ${{ !inputs.unlist_unwanted_1_0_0 }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Ekom release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_REF_TYPE -ne "tag" -or $env:RELEASE_TAG -notmatch '^Ekom-v(?<version>0\.2\.\d+)$') {
            throw "Ekom releases must use an Ekom-v0.2.x tag. Version-line changes require explicit maintainer approval."
          }
          $version = $Matches['version']
          [xml] $props = Get-Content "Ekom/Directory.Build.props" -Raw
          $buildVersion = [string] ($props.Project.PropertyGroup.Version | Where-Object { $_ })
          $manifest = Get-Content ".release-please-manifest.json" -Raw | ConvertFrom-Json
          if ($buildVersion -ne $version -or $manifest.Ekom -ne $version) {
            throw "Tag version $version must match the Ekom build version ($buildVersion) and release manifest ($($manifest.Ekom))."
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Restore shared packages
        shell: pwsh
        run: |
          dotnet restore "Ekom/Ekom.Core/Ekom.AspNetCore/Ekom.AspNetCore.csproj"

      - name: Build shared packages (Release)
        run: dotnet build "Ekom/Ekom.Core/Ekom.AspNetCore/Ekom.AspNetCore.csproj" -c Release --no-restore

      - name: Restore U10 packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore "Ekom/Ekom.Umbraco/Ekom.U10/Ekom.U10.csproj" -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0
          dotnet restore "Ekom/Ekom.Web/Ekom.Web/Ekom.Web.csproj" -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0

      - name: Build U10 packages (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build "Ekom/Ekom.Umbraco/Ekom.U10/Ekom.U10.csproj" -c Release --no-restore -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0
          dotnet build "Ekom/Ekom.Web/Ekom.Web/Ekom.Web.csproj" -c Release --no-restore -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0

      - name: Restore U17 packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore "Ekom/Ekom.Umbraco/Ekom.U17/Ekom.U17.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet restore "Ekom/Ekom.Web/Ekom.Web.U17/Ekom.Web.U17.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

      - name: Build U17 packages (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build "Ekom/Ekom.Umbraco/Ekom.U17/Ekom.U17.csproj" -c Release --no-restore -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet build "Ekom/Ekom.Web/Ekom.Web.U17/Ekom.Web.U17.csproj" -c Release --no-restore -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

      - name: Restore U18 packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore "Ekom/Ekom.Umbraco/Ekom.U18/Ekom.U18.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet restore "Ekom/Ekom.Web/Ekom.Web.U18/Ekom.Web.U18.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

      - name: Build U18 packages (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build "Ekom/Ekom.Umbraco/Ekom.U18/Ekom.U18.csproj" -c Release --no-restore -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet build "Ekom/Ekom.Web/Ekom.Web.U18/Ekom.Web.U18.csproj" -c Release --no-restore -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

      - name: Pack Ekom packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          function Get-SemVerFromTag([string] $tag) {
            if ($tag -match 'v(?<ver>\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?)$') { return $Matches['ver'] }
            throw "Could not parse SemVer from tag '$tag'"
          }

          $tag = "${{ github.ref_name }}"   # e.g. Ekom-v0.2.13
          $version = Get-SemVerFromTag $tag

          if (Test-Path "artifacts") { Remove-Item "artifacts" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          Write-Host "Packing Ekom packages with PackageVersion=$version (tag $tag)"

          dotnet restore "Ekom/Ekom.Core/Ekom.AspNetCore/Ekom.AspNetCore.csproj"
          dotnet pack "Ekom/Ekom.Core/Ekom.Common/Ekom.Common.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom/Ekom.Core/Ekom/Ekom.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom/Ekom.Core/Ekom.AspNetCore/Ekom.AspNetCore.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version

          dotnet restore "Ekom/Ekom.Umbraco/Ekom.U10/Ekom.U10.csproj" -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0
          dotnet restore "Ekom/Ekom.Web/Ekom.Web/Ekom.Web.csproj" -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0
          dotnet pack "Ekom/Ekom.Umbraco/Ekom.U10/Ekom.U10.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0
          dotnet pack "Ekom/Ekom.Web/Ekom.Web/Ekom.Web.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0

          dotnet restore "Ekom/Ekom.Umbraco/Ekom.U17/Ekom.U17.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet restore "Ekom/Ekom.Web/Ekom.Web.U17/Ekom.Web.U17.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet pack "Ekom/Ekom.Umbraco/Ekom.U17/Ekom.U17.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet pack "Ekom/Ekom.Web/Ekom.Web.U17/Ekom.Web.U17.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

          dotnet restore "Ekom/Ekom.Umbraco/Ekom.U18/Ekom.U18.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet restore "Ekom/Ekom.Web/Ekom.Web.U18/Ekom.Web.U18.csproj" -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet pack "Ekom/Ekom.Umbraco/Ekom.U18/Ekom.U18.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0
          dotnet pack "Ekom/Ekom.Web/Ekom.Web.U18/Ekom.Web.U18.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

          $expectedPackages = @(
            "Ekom.Common.$version.nupkg"
            "Ekom.Core.$version.nupkg"
            "Ekom.AspNetCore.$version.nupkg"
            "Ekom.U10.$version.nupkg"
            "Ekom.Web.$version.nupkg"
            "Ekom.U17.$version.nupkg"
            "Ekom.Web.U17.$version.nupkg"
            "Ekom.U18.$version.nupkg"
            "Ekom.Web.U18.$version.nupkg"
          )
          $missingPackages = $expectedPackages | Where-Object {
            -not (Test-Path (Join-Path "artifacts" $_) -PathType Leaf)
          }
          if ($missingPackages) {
            throw "Missing expected packages: $($missingPackages -join ', ')"
          }

          Get-ChildItem -Path artifacts -Filter *.nupkg -File | Format-Table Name,Length

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Vettvangur

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pkgs = Get-ChildItem -Path "artifacts" -Filter "*.nupkg" -File
          if (-not $pkgs) { throw "No .nupkg files found under artifacts/." }

          foreach ($p in $pkgs) {
            Write-Host "Pushing $($p.Name)"
            dotnet nuget push "$($p.FullName)" `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source "https://api.nuget.org/v3/index.json" `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($p.Name)" }
          }

  unlist-unwanted-1-0-0:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.unlist_unwanted_1_0_0 }}
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Wait for both corrected releases before unlisting
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @("ekom.common", "ekom.core", "ekom.aspnetcore", "ekom.u10", "ekom.web", "ekom.u17", "ekom.web.u17", "ekom.u18", "ekom.web.u18")
          $deadline = (Get-Date).AddMinutes(20)
          do {
            $missing = @()
            foreach ($package in $packages) {
              foreach ($version in @("0.2.318", "0.2.319")) {
                try {
                  Invoke-WebRequest -Method Head -Uri "https://api.nuget.org/v3-flatcontainer/$package/$version/$package.$version.nupkg" -TimeoutSec 15 | Out-Null
                } catch {
                  $missing += "$package $version"
                }
              }
            }
            if ($missing.Count -eq 0) { break }
            if ((Get-Date) -ge $deadline) { throw "Corrected packages are not all available; refusing to unlist 1.0.0: $($missing -join ', ')" }
            Write-Host "Waiting for corrected packages: $($missing -join ', ')"
            Start-Sleep -Seconds 30
          } while ($true)

      - name: NuGet Login (OIDC)
        id: cleanup-login
        uses: NuGet/login@v1
        with:
          user: Vettvangur

      - name: Unlist only unintended Ekom 1.0.0 packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.cleanup-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @("Ekom.Common", "Ekom.Core", "Ekom.AspNetCore", "Ekom.U10", "Ekom.Web", "Ekom.U17", "Ekom.Web.U17", "Ekom.U18", "Ekom.Web.U18")
          foreach ($package in $packages) {
            dotnet nuget delete $package 1.0.0 --non-interactive --api-key $env:NUGET_API_KEY --source "https://api.nuget.org/v3/index.json"
            if ($LASTEXITCODE -ne 0) { throw "Unlisting $package 1.0.0 failed; check the trusted publishing policy's unlist permission." }
          }
