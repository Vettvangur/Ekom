name: release-please

on:
  push:
    branches: ["Ekom"]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: windows-latest

    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.rp.outputs.release_created == 'true' }}

      - uses: actions/setup-dotnet@v4
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        run: dotnet restore "./Ekom Build.sln"

      - name: Build (Release)
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        run: dotnet build -c Release --no-restore

      - name: Pack (set PackageVersion from tag)
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        shell: pwsh
        run: |
          $tag = "${{ steps.rp.outputs.tag_name }}"   # e.g. v0.1.23
          $version = $tag.TrimStart("v")

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          dotnet pack "Ekom/Ekom.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom.Common/Ekom.Common.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom.AspNetCore/Ekom.AspNetCore.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom.U10/Ekom.U10.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom.Web/Ekom.Web.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version

      - name: NuGet Login (OIDC)
        id: login
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        uses: NuGet/login@v1
        with:
          user: Vettvangur

      - name: Push to NuGet.org
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        shell: pwsh
        run: |
          dotnet nuget push "artifacts/*.nupkg" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate
