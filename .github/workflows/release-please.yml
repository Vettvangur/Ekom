name: release-please

on:
  push:
    branches: ["Ekom"]
    paths:
      - "Ekom/**"
      - ".release-please-manifest.json"
      - "release-please-config.json"
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: "Publish packages to NuGet"
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: windows-latest

    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-dotnet@v4
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: dotnet restore "./Ekom Build.sln"

      - name: Build (Release)
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: dotnet build "./Ekom Build.sln" -c Release --no-restore

      - name: Pack (use tag or manifest version)
        if: ${{ steps.rp.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-SemVerFromString([string] $s) {
            if ([string]::IsNullOrWhiteSpace($s)) { return $null }

            # Extract first SemVer-like token: 0.2.1 or 0.2.1-beta.1 (NuGet allows prerelease)
            if ($s -match '(?<ver>\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?)') {
              return $Matches['ver']
            }

            return $null
          }

          # Prefer release-please tag version when a release was created
          $tag = "${{ steps.rp.outputs.tag_name }}"  # e.g. v0.2.1 or Ekom-v0.2.1

          $version = Get-SemVerFromString $tag

          if (-not [string]::IsNullOrWhiteSpace($version)) {
            Write-Host "Using version from release-please tag: $version (tag was '$tag')"
          }
          else {
            # Manual rerun path: take the current version from manifest
            $manifestPath = ".release-please-manifest.json"
            if (-not (Test-Path $manifestPath)) {
              throw "Manifest file not found: $manifestPath"
            }

            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json

            # release-please manifest keys are paths. Commonly "." for root.
            if ($manifest.PSObject.Properties.Name -contains ".") {
              $manifestVersion = [string]$manifest."."
              Write-Host "Using version from manifest '.' : $manifestVersion"
            }
            else {
              # Fallback: if your manifest uses a different key, pick the first one.
              $firstKey = $manifest.PSObject.Properties.Name | Select-Object -First 1
              $manifestVersion = [string]$manifest.$firstKey
              Write-Host "Using version from manifest '$firstKey' : $manifestVersion"
            }

            $version = Get-SemVerFromString $manifestVersion

            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not determine a valid SemVer from manifest value '$manifestVersion' in $manifestPath"
            }
          }

          # Final defensive validation for NuGet PackageVersion
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?$') {
            throw "Computed version '$version' is not a valid NuGet SemVer."
          }

          Write-Host "Packing with PackageVersion=$version"

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          dotnet pack "Ekom/Ekom.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom.Common/Ekom.Common.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "AspNetCore/Ekom.AspNetCore/Ekom.AspNetCore.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "AspNetCore/Ekom.U10/Ekom.U10.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version
          dotnet pack "Ekom.Web/Ekom.Web.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version

          $pkgs = Get-ChildItem -Path artifacts -Filter *.nupkg -File
          $pkgs | Format-Table Name,Length


      - name: NuGet Login (OIDC)
        id: login
        if: ${{ steps.rp.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        uses: NuGet/login@v1
        with:
          user: Vettvangur
          
      - name: Push to NuGet.org
        if: ${{ steps.rp.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pkgs = Get-ChildItem -Path "artifacts" -Filter "*.nupkg" -File -ErrorAction SilentlyContinue
          if (-not $pkgs) {
            Write-Host "No .nupkg found. Listing artifacts:"
            Get-ChildItem -Recurse -Force "artifacts" | Format-Table FullName,Length
            throw "No .nupkg files found under artifacts/"
          }

          foreach ($p in $pkgs) {
            Write-Host "Pushing $($p.FullName)"
            dotnet nuget push "$($p.FullName)" `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source "https://api.nuget.org/v3/index.json" `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($p.Name)" }
          }

