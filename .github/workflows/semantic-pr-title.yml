name: semantic-pr-title

on:
  # GitHub blocks pull_request_target by default on public repositories. Reading the PR title
  # needs no secrets or write access, so the plain pull_request event is enough.
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: ["Ekom", "release/0.2"]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
