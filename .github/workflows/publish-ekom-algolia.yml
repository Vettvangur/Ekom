name: publish-ekom-algolia

on:
  push:
    tags:
      - "Ekom.Algolia-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish-ekom-algolia:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore (force NuGet references)
        run: dotnet restore "Plugins/Ekom.Algolia/Ekom.Algolia.csproj" -p:UseProjectReferences=false

      - name: Build (Release, force NuGet references)
        run: dotnet build "Plugins/Ekom.Algolia/Ekom.Algolia.csproj" -c Release --no-restore -p:UseProjectReferences=false

      - name: Pack Ekom.Algolia (force NuGet references)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-SemVerFromTag([string] $tag) {
            if ($tag -match 'v(?<ver>\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?)$') { return $Matches['ver'] }
            throw "Could not parse SemVer from tag '$tag'"
          }

          $tag = "${{ github.ref_name }}"   # e.g. Ekom.Algolia-v0.2.0
          $version = Get-SemVerFromTag $tag

          if (Test-Path "artifacts") { Remove-Item "artifacts" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          Write-Host "Packing Ekom.Algolia with PackageVersion=$version (tag $tag)"

          dotnet pack "Plugins/Ekom.Algolia/Ekom.Algolia.csproj" `
            -c Release `
            --no-build `
            -o artifacts `
            -p:PackageVersion=$version `
            -p:UseProjectReferences=false

          Get-ChildItem -Path artifacts -Filter "Ekom.Algolia*.nupkg" -File | Format-Table Name,Length

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Vettvangur

      - name: Push Ekom.Algolia to NuGet.org
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pkgs = Get-ChildItem -Path "artifacts" -Filter "Ekom.Algolia*.nupkg" -File
          if (-not $pkgs) { throw "No Ekom.Algolia .nupkg files found under artifacts/." }

          foreach ($p in $pkgs) {
            Write-Host "Pushing $($p.Name)"
            dotnet nuget push "$($p.FullName)" `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source "https://api.nuget.org/v3/index.json" `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($p.Name)" }
          }
