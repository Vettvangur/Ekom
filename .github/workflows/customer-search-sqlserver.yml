name: Customer search SQL Server
on:
  pull_request:
    branches: [Ekom]
    paths:
      - 'Ekom/Ekom.Core/Ekom/Repositories/CustomerRepository.cs'
      - 'Ekom/Tests/Ekom.Tests/Tests/ManagerCustomerSqlServerTests.cs'
      - '.github/workflows/customer-search-sqlserver.yml'
permissions:
  contents: read
jobs:
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'Ekom-Test_Only_2026!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ekom-Test_Only_2026!' -C -Q 'SELECT 1' -b"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Compare customer search against SQL Server
        env:
          EKOM_TEST_SQLSERVER: 'Server=localhost,1433;User ID=sa;Password=Ekom-Test_Only_2026!;Encrypt=true;TrustServerCertificate=true'
        run: dotnet test Ekom/Tests/Ekom.Tests/Ekom.Tests.csproj --filter FullyQualifiedName~ManagerCustomerSqlServerTests --logger 'console;verbosity=detailed' --logger trx --results-directory sqlserver-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-search-sqlserver-results
          path: sqlserver-results
