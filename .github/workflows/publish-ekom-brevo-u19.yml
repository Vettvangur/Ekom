name: publish-ekom-brevo-u19

on:
  push:
    tags:
      - "Ekom.Brevo.U19-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish-ekom-brevo-u19:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'Ekom.Brevo.U19-v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Read Ekom package version
        id: ekom-version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$props = Get-Content "Ekom/Directory.Build.props"
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read Ekom package version." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Pack every Ekom package the plugin depends on, so the build never waits for NuGet.org to index
      # an Ekom version that was released at the same time.
      - name: Pack Ekom U19 dependencies locally
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.ekom-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path local-packages | Out-Null
          dotnet pack "Ekom/Ekom.Core/Ekom.Common/Ekom.Common.csproj" -c Release -o local-packages -p:PackageVersion=$version -p:UseProjectReferences=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet command failed with exit code $LASTEXITCODE" }
          dotnet pack "Ekom/Ekom.Core/Ekom/Ekom.csproj" -c Release -o local-packages -p:PackageVersion=$version -p:UseProjectReferences=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet command failed with exit code $LASTEXITCODE" }
          dotnet pack "Ekom/Ekom.Core/Ekom.AspNetCore/Ekom.AspNetCore.csproj" -c Release -o local-packages -p:PackageVersion=$version -p:UseProjectReferences=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet command failed with exit code $LASTEXITCODE" }
          dotnet pack "Ekom/Ekom.Umbraco/Ekom.U19/Ekom.U19.csproj" -c Release -o local-packages -p:PackageVersion=$version -p:UseProjectReferences=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet command failed with exit code $LASTEXITCODE" }
          dotnet nuget add source "$PWD/local-packages" --name local-ekom
          if ($LASTEXITCODE -ne 0) { throw "dotnet command failed with exit code $LASTEXITCODE" }

      - name: Restore (force NuGet references)
        run: dotnet restore "Plugins/Ekom.Brevo/U19/Ekom.Brevo.U19.csproj" -p:UseProjectReferences=false -p:EkomPackageVersion=${{ steps.ekom-version.outputs.version }}

      - name: Build (Release, force NuGet references)
        run: dotnet build "Plugins/Ekom.Brevo/U19/Ekom.Brevo.U19.csproj" -c Release --no-restore -p:UseProjectReferences=false -p:EkomPackageVersion=${{ steps.ekom-version.outputs.version }}

      - name: Pack Ekom.Brevo.U19
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref_name }}" -notmatch '^Ekom\.Brevo\.U19-v(?<ver>\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?)$') { throw "Could not parse SemVer from tag '${{ github.ref_name }}'" }
          $version = $Matches['ver']
          dotnet pack "Plugins/Ekom.Brevo/U19/Ekom.Brevo.U19.csproj" -c Release --no-build -o artifacts -p:PackageVersion=$version -p:UseProjectReferences=false -p:EkomPackageVersion=${{ steps.ekom-version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "dotnet command failed with exit code $LASTEXITCODE" }

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Vettvangur

      - name: Push Ekom.Brevo.U19 to NuGet.org
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path artifacts -Filter "Ekom.Brevo.U19*.nupkg" -File | ForEach-Object {
            dotnet nuget push "$($_.FullName)" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($_.Name)" }
          }
